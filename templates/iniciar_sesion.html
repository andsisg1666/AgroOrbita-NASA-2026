<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - AgroÓrbita NASA 2026</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilo.css') }}">

    <style>
        .contenedor-login {
            max-width: 460px;
            margin: 70px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px #dce8df;
            box-sizing: border-box;
        }

        .contenedor-login h1 {
            color: #17653c;
            text-align: center;
        }

        .descripcion {
            text-align: center;
            color: #607568;
            margin-bottom: 30px;
        }

        .grupo {
            margin-bottom: 20px;
        }

        .grupo label {
            display: block;
            color: #245b3e;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .grupo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbded1;
            border-radius: 9px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .boton-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #16854c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-login:hover {
            background: #106b3b;
        }

        .enlace {
            text-align: center;
            margin-top: 20px;
        }

        .enlace a {
            color: #17653c;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="encabezado">
        <h2>🌎 AgroÓrbita</h2>

        <nav>
            <a href="/">Inicio</a>
            <a href="/registrar-usuario">Crear cuenta</a>
        </nav>
    </header>

    <main class="contenedor-login">

        <h1>🔐 Iniciar sesión</h1>

        <p class="descripcion">
            Bienvenido a AgroÓrbita NASA 2026.
            Ingresa para gestionar tus terrenos
            agrícolas.
        </p>

        <form method="POST">

            <div class="grupo">
                <label for="correo">
                    Correo electrónico
                </label>

                <input type="email"
                       id="correo"
                       name="correo"
                       placeholder="ejemplo@correo.com"
                       autocomplete="email"
                       required>
            </div>

            <div class="grupo">
                <label for="contrasena">
                    Contraseña
                </label>

                <input type="password"
                       id="contrasena"
                       name="contrasena"
                       placeholder="Ingresa tu contraseña"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="boton-login">
                🔓 Ingresar a AgroÓrbita
            </button>

        </form>

        <p class="enlace">
            ¿No tienes una cuenta?
            <a href="/registrar-usuario">
                Regístrate aquí
            </a>
        </p>

    </main>

    <footer>
        AgroÓrbita NASA 2026 |
        Proyecto académico con Flask y SQLite
    </footer>

</body>
</html>
