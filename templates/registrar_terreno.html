
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar terreno - AgroÓrbita</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilo.css') }}">

    <style>
        .contenedor-formulario {
            max-width: 850px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 25px #dce8df;
        }

        .contenedor-formulario h1 {
            color: #17653c;
            margin-bottom: 12px;
        }

        .descripcion {
            margin-bottom: 30px;
            color: #607568;
        }

        .grupo {
            margin-bottom: 20px;
        }

        .grupo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #245b3e;
        }

        .grupo input,
        .grupo select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbded1;
            border-radius: 9px;
            font-size: 16px;
        }

        .fila {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(220px, 1fr)
            );
            gap: 20px;
        }

        .acciones {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .boton-secundario {
            display: inline-block;
            padding: 16px 25px;
            background: #e5f0e9;
            color: #245b3e;
            border-radius: 12px;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <header class="encabezado">
        <h2>🌎 AgroÓrbita</h2>

        <nav>
            <a href="/">Inicio</a>
            <a href="#formulario">Registrar terreno</a>
        </nav>
    </header>

    <main class="contenedor-formulario" id="formulario">

        <h1>🌱 Registrar terreno agrícola</h1>

        <p class="descripcion">
            Registra los datos de tu parcela para
            explorar información climática de NASA
            y alternativas de rotación de cultivos.
        </p>

        <form action="/registrar-terreno" method="POST">

            <div class="grupo">
                <label for="nombre">Nombre del terreno</label>
                <input type="text" id="nombre"
                       name="nombre"
                       placeholder="Ejemplo: Parcela Lima"
                       required>
            </div>

            <div class="grupo">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion"
                       name="ubicacion"
                       placeholder="Ejemplo: Lima, Perú"
                       required>
            </div>

            <div class="fila">

                <div class="grupo">
                    <label for="latitud">Latitud</label>
                    <input type="number" id="latitud"
                           name="latitud"
                           step="any" min="-90" max="90"
                           placeholder="-12.0464"
                           required>
                </div>

                <div class="grupo">
                    <label for="longitud">Longitud</label>
                    <input type="number" id="longitud"
                           name="longitud"
                           step="any" min="-180" max="180"
                           placeholder="-77.0428"
                           required>
                </div>

            </div>

            <div class="grupo">
                <label for="cultivo_actual">Cultivo actual</label>
                <select id="cultivo_actual"
                        name="cultivo_actual" required>
                    <option value="">Selecciona un cultivo</option>
                    <option value="Maíz">Maíz</option>
                    <option value="Papa">Papa</option>
                    <option value="Arroz">Arroz</option>
                    <option value="Trigo">Trigo</option>
                    <option value="Frijol">Frijol</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="grupo">
                <label for="tipo_suelo">Tipo de suelo</label>
                <select id="tipo_suelo"
                        name="tipo_suelo" required>
                    <option value="">Selecciona el suelo</option>
                    <option value="Arenoso">Arenoso</option>
                    <option value="Arcilloso">Arcilloso</option>
                    <option value="Franco">Franco</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="grupo">
                <label for="superficie">
                    Superficie (hectáreas)
                </label>
                <input type="number" id="superficie"
                       name="superficie"
                       min="0.01" step="any"
                       placeholder="Ejemplo: 1.5"
                       required>
            </div>

            <div class="grupo">
                <label for="prioridad">
                    Prioridad agrícola
                </label>
                <select id="prioridad"
                        name="prioridad" required>
                    <option value="">Selecciona una prioridad</option>
                    <option value="Ahorrar agua">Ahorrar agua</option>
                    <option value="Mejorar el suelo">Mejorar el suelo</option>
                    <option value="Diversificar cultivos">
                        Diversificar cultivos
                    </option>
                </select>
            </div>

            <div class="acciones">
                <button type="submit" class="boton">
                    💾 Guardar terreno
                </button>

                <a href="/" class="boton-secundario">
                    Volver al inicio
                </a>
            </div>

        </form>

    </main>

    <footer>
        AgroÓrbita NASA 2026 |
        Proyecto académico con Flask y SQLite
    </footer>

</body>
</html>
