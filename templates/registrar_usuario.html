<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - AgroÓrbita NASA 2026</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilo.css') }}">

    <style>
        .contenedor-registro {
            max-width: 520px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px #dce8df;
        }

        .contenedor-registro h1 {
            color: #17653c;
            text-align: center;
        }

        .descripcion {
            text-align: center;
            color: #607568;
            margin-bottom: 30px;
        }

        .grupo {
            margin-bottom: 20px;
        }

        .grupo label {
            display: block;
            color: #245b3e;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .grupo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbded1;
            border-radius: 9px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .boton-registro {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #16854c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-registro:hover {
            background: #106b3b;
        }

        .enlace {
            text-align: center;
            margin-top: 20px;
        }

        .enlace a {
            color: #17653c;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="encabezado">
        <h2>🌎 AgroÓrbita</h2>

        <nav>
            <a href="/">Inicio</a>
        </nav>
    </header>

    <main class="contenedor-registro">

        <h1>🌱 Crear cuenta</h1>

        <p class="descripcion">
            Regístrate para gestionar tus terrenos
            agrícolas y consultar información
            climática de NASA.
        </p>

        <form method="POST">

            <div class="grupo">
                <label for="nombre">
                    Nombre completo
                </label>

                <input type="text"
                       id="nombre"
                       name="nombre"
                       placeholder="Escribe tu nombre"
                       maxlength="100"
                       required>
            </div>

            <div class="grupo">
                <label for="correo">
                    Correo electrónico
                </label>

                <input type="email"
                       id="correo"
                       name="correo"
                       placeholder="ejemplo@correo.com"
                       required>
            </div>

            <div class="grupo">
                <label for="contrasena">
                    Contraseña
                </label>

                <input type="password"
                       id="contrasena"
                       name="contrasena"
                       minlength="8"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="grupo">
                <label for="confirmar_contrasena">
                    Confirmar contraseña
                </label>

                <input type="password"
                       id="confirmar_contrasena"
                       name="confirmar_contrasena"
                       minlength="8"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit"
                    class="boton-registro">
                ✅ Crear mi cuenta
            </button>

        </form>

        <p class="enlace">
            <a href="/">← Volver al inicio</a>
        </p>

    </main>

    <footer>
        AgroÓrbita NASA 2026 |
        Proyecto académico con Flask y SQLite
    </footer>

</body>
</html>
